# AT-3 (docs/spikes-android/AT3-plano.md): compila o FFmpegKitNext LGPL,
# arm64-v8a only, e publica o AAR + evidências do gate como artifact.
#
# Este arquivo É o "script de build reproduzível" que a spec §12.1 exige
# versionar. Vive na branch android-port (main fica intocada — decisão C1):
# o disparo primário é por push de a tag `at3-ffmpeg-build-*`, que roda o
# workflow da própria ref pushada, sem exigir presença na branch default.
# O workflow_dispatch fica disponível para o futuro (quando o android-port
# for mesclado em main) ou via API.
#
# Fatos verificados no upstream em 2026-07-14 (não inferidos):
# - tag real: v8.1.0 (commit 3e223118e6e8fb6208693ecf3952e77cd096f587);
# - o build da v8.1.0 é via Nix: ./nix-android.sh --profile android-r27d
#   (flake fixa NDK 27.3.13750724 = r27d, que alinha 16 KB por padrão);
# - --enable-openh264 existe (scripts/function.sh:926); GPL só entra com
#   --enable-gpl explícito (que NUNCA usamos);
# - --api-level=api existe, default 24 (usamos 28 = minSdk do app);
# - o AAR sai "under the prebuilt folder";
# - a release v8.1.0 NÃO publica binários (reconfirmado) — build é obrigatório.
name: build-ffmpeg-kit-next

on:
  push:
    tags:
      - 'at3-ffmpeg-build-*'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Tag do arthenica/ffmpeg-kit-next'
        required: true
        default: 'v8.1.0'
      enable_openh264:
        description: 'Incluir --enable-openh264 (decisão C3 do AT3-plano)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # No disparo por tag, inputs é vazio — caem os defaults.
      UPSTREAM_TAG: ${{ inputs.upstream_tag || 'v8.1.0' }}
      OPENH264_FLAG: ${{ (github.event_name == 'push' || inputs.enable_openh264) && '--enable-openh264' || '' }}
    steps:
      - name: Liberar disco (o SDK Android do runner não é usado — o Nix traz o dele)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Instalar Nix (flakes habilitados)
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Checkout pinado do ffmpeg-kit-next
        run: |
          git clone https://github.com/arthenica/ffmpeg-kit-next.git src
          cd src
          git checkout "$UPSTREAM_TAG"
          mkdir -p ../evidence
          git rev-parse HEAD | tee ../evidence/upstream-commit.txt

      - name: Build (LGPL, arm64-v8a only, API 28)
        working-directory: src
        run: |
          ./nix-android.sh --profile android-r27d \
            --disable-arm-v7a --disable-arm-v7a-neon --disable-x86 --disable-x86-64 \
            --api-level=28 \
            $OPENH264_FLAG

      # Coleta best-effort: NUNCA falha, para o artifact sempre subir e poder
      # ser inspecionado. As checagens que reprovam o gate ficam no step
      # seguinte, depois do upload.
      - name: Coletar evidências (best-effort)
        if: always()
        working-directory: src
        run: |
          set +e
          # Mapa do que o build produziu — descobre os caminhos reais (o layout
          # do nix-build da v8.1.0 ainda não foi observado de dentro).
          find prebuilt -type f 2>/dev/null | head -200 | tee ../evidence/prebuilt-tree.txt
          find . -name '*.log' 2>/dev/null | head -50 | tee ../evidence/logs-found.txt
          # Prova de licença — a linha de configuração do ffmpeg mora no config.log
          # do configure (contém a linha de comando completa) e/ou numa linha
          # "configuration:". Buscar amplamente e guardar de onde veio.
          {
            echo "### grep 'configuration:' em toda a árvore src:"
            grep -rIl "configuration:" . 2>/dev/null | head -20
            echo "### ocorrências de enable-gpl (deve ser vazio):"
            grep -rIn -- "--enable-gpl" . 2>/dev/null | grep -v "help\|\.md\|usage" | head -20
            echo "### config.log do ffmpeg (linha de configure):"
            for cl in $(find . -name config.log -path '*ffmpeg*' 2>/dev/null | head -5); do
              echo "--- $cl ---"; grep -m1 -i "configuration\|configure " "$cl"
            done
          } | tee ../evidence/buildconf-search.txt
          # Melhor tentativa de um buildconf.txt limpo:
          grep -rIh "configuration:" . 2>/dev/null | sort -u | head -5 > ../evidence/buildconf.txt
          # AAR + .so:
          AAR=$(find prebuilt -name '*.aar' 2>/dev/null | head -1)
          echo "AAR=$AAR" | tee ../evidence/aar-path.txt
          if [ -n "$AAR" ]; then
            cp "$AAR" ../evidence/ffmpeg-kit.aar
            mkdir -p ../evidence/so && (cd ../evidence/so && unzip -o ../ffmpeg-kit.aar >/dev/null 2>&1)
            { find ../evidence/so -name '*.so' -exec ls -la {} \; ; \
              find ../evidence/so -name '*.so' -exec sha256sum {} \; ; } | tee ../evidence/so-inventory.txt
            for so in $(find ../evidence/so -name '*.so' 2>/dev/null); do
              echo "== $so =="; readelf -l "$so" 2>/dev/null | grep -E '^\s*LOAD'
            done | tee ../evidence/alignment.txt
          fi
          true

      - name: Publicar artifact (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-arm64-lgpl
          if-no-files-found: warn
          path: evidence/**

      # Diagnóstico no Summary da run (visível no navegador sem baixar nada —
      # o download de artifact/logs exige auth admin, o Summary não).
      - name: Resumo diagnóstico no Summary
        if: always()
        working-directory: evidence
        run: |
          {
            echo "## AT-3 build — diagnóstico"
            echo '### aar-path'; echo '```'; cat aar-path.txt 2>/dev/null; echo '```'
            echo '### buildconf.txt (primeiras linhas)'; echo '```'; head -5 buildconf.txt 2>/dev/null; echo '```'
            echo '### buildconf-search.txt'; echo '```'; cat buildconf-search.txt 2>/dev/null; echo '```'
            echo '### logs-found.txt'; echo '```'; cat logs-found.txt 2>/dev/null; echo '```'
            echo '### prebuilt-tree.txt (primeiras 60)'; echo '```'; head -60 prebuilt-tree.txt 2>/dev/null; echo '```'
            echo '### alignment.txt'; echo '```'; cat alignment.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Gate dividido em checagens NOMEADAS: cada conclusão é legível via API
      # anonimamente (nome + success/failure), então a próxima run diz por si
      # qual asserção reprovou, sem eu precisar ler log. Todas rodam (always).
      - name: 'Gate 1 — AAR produzido'
        if: always()
        working-directory: evidence
        run: test -f ffmpeg-kit.aar
      - name: 'Gate 2 — buildconf capturado'
        if: always()
        working-directory: evidence
        run: test -s buildconf.txt
      - name: 'Gate 3 — sem --enable-gpl'
        if: always()
        working-directory: evidence
        run: '! grep -q -- "--enable-gpl" buildconf.txt'
      - name: 'Gate 4 — inventário de alinhamento existe'
        if: always()
        working-directory: evidence
        run: test -s alignment.txt
      - name: 'Gate 5 — todas as .so com LOAD 0x4000 (16 KB)'
        if: always()
        working-directory: evidence
        run: '! grep -E "^\s*LOAD" alignment.txt | grep -qv "0x4000"'
