# AT-3 (docs/spikes-android/AT3-plano.md): compila o FFmpegKitNext LGPL,
# arm64-v8a only, e publica o AAR + evidências do gate como artifact.
#
# Este arquivo É o "script de build reproduzível" que a spec §12.1 exige
# versionar. Vive na branch android-port (main fica intocada — decisão C1):
# o disparo primário é por push de a tag `at3-ffmpeg-build-*`, que roda o
# workflow da própria ref pushada, sem exigir presença na branch default.
# O workflow_dispatch fica disponível para o futuro (quando o android-port
# for mesclado em main) ou via API.
#
# Fatos verificados no upstream em 2026-07-14 (não inferidos):
# - tag real: v8.1.0 (commit 3e223118e6e8fb6208693ecf3952e77cd096f587);
# - o build da v8.1.0 é via Nix: ./nix-android.sh --profile android-r27d
#   (flake fixa NDK 27.3.13750724 = r27d, que alinha 16 KB por padrão);
# - --enable-openh264 existe (scripts/function.sh:926); GPL só entra com
#   --enable-gpl explícito (que NUNCA usamos);
# - --api-level=api existe, default 24 (usamos 28 = minSdk do app);
# - o AAR sai "under the prebuilt folder";
# - a release v8.1.0 NÃO publica binários (reconfirmado) — build é obrigatório.
name: build-ffmpeg-kit-next

on:
  push:
    tags:
      - 'at3-ffmpeg-build-*'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Tag do arthenica/ffmpeg-kit-next'
        required: true
        default: 'v8.1.0'
      enable_openh264:
        description: 'Incluir --enable-openh264 (decisão C3 do AT3-plano)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # contents:write só pro passo final (publicar a Release na própria tag) —
    # mesmo padrão do build-slimt.yml (P1, 2026-07-16): o artifact do
    # upload-artifact expira em ~90 dias e exige login pra baixar; a Release
    # é permanente e pública.
    permissions:
      contents: write
    env:
      # No disparo por tag, inputs é vazio — caem os defaults.
      UPSTREAM_TAG: ${{ inputs.upstream_tag || 'v8.1.0' }}
      OPENH264_FLAG: ${{ (github.event_name == 'push' || inputs.enable_openh264) && '--enable-openh264' || '' }}
    steps:
      - name: Liberar disco (o SDK Android do runner não é usado — o Nix traz o dele)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Instalar Nix (flakes habilitados)
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Checkout pinado do ffmpeg-kit-next
        run: |
          git clone https://github.com/arthenica/ffmpeg-kit-next.git src
          cd src
          git checkout "$UPSTREAM_TAG"
          mkdir -p ../evidence
          git rev-parse HEAD | tee ../evidence/upstream-commit.txt

      - name: Build (LGPL, arm64-v8a only, API 28)
        working-directory: src
        run: |
          ./nix-android.sh --profile android-r27d \
            --disable-arm-v7a --disable-arm-v7a-neon --disable-x86 --disable-x86-64 \
            --api-level=28 \
            $OPENH264_FLAG

      # Coleta best-effort: NUNCA falha, para o artifact sempre subir e poder
      # ser inspecionado. As checagens que reprovam o gate ficam no step
      # seguinte, depois do upload.
      - name: Coletar evidências (best-effort)
        if: always()
        working-directory: src
        run: |
          set +e
          # Mapa do que o build produziu — descobre os caminhos reais (o layout
          # do nix-build da v8.1.0 ainda não foi observado de dentro).
          find prebuilt -type f 2>/dev/null | head -200 | tee ../evidence/prebuilt-tree.txt
          find . -name '*.log' 2>/dev/null | head -50 | tee ../evidence/logs-found.txt
          # AAR + .so primeiro — a prova de licença real (abaixo) precisa dos
          # binários já extraídos.
          AAR=$(find prebuilt -name '*.aar' 2>/dev/null | head -1)
          echo "AAR=$AAR" | tee ../evidence/aar-path.txt
          if [ -n "$AAR" ]; then
            cp "$AAR" ../evidence/ffmpeg-kit.aar
            mkdir -p ../evidence/so && (cd ../evidence/so && unzip -o ../ffmpeg-kit.aar >/dev/null 2>&1)
            { find ../evidence/so -name '*.so' -exec ls -la {} \; ; \
              find ../evidence/so -name '*.so' -exec sha256sum {} \; ; } | tee ../evidence/so-inventory.txt
            # -lW: formato de linha única (sem -W, o readelf quebra cada
            # entrada de program header em DUAS linhas, e a coluna Align fica
            # na segunda — um grep só na primeira nunca vê o alinhamento real;
            # foi o que aconteceu no build-4, achando "falha" que não existia).
            for so in $(find ../evidence/so -name '*.so' 2>/dev/null); do
              echo "== $so =="; readelf -lW "$so" 2>/dev/null | grep -E '^\s*LOAD'
            done | tee ../evidence/alignment.txt
          fi
          # Prova de licença REAL: o FFmpeg embute a linha exata do ./configure
          # (macro FFMPEG_CONFIGURATION) como string constante no próprio
          # binário compilado — extraída com `strings`, não com grep na árvore
          # fonte. (grep "configuration:" no source só pega format strings tipo
          # `av_log(..., "%s%-11s configuration: %s\n", ...)` — não a linha real;
          # foi o que aconteceu nos builds 1-5: buildconf.txt "passava" o Gate2/3
          # sem checar nada de verdade. Verificado localmente com llvm-strings
          # contra este mesmo .so antes de mudar isto.)
          LIBAVUTIL=$(find ../evidence/so -name 'libavutil.so' 2>/dev/null | head -1)
          if [ -n "$LIBAVUTIL" ]; then
            strings "$LIBAVUTIL" 2>/dev/null | grep -m1 -- "--target-os=" \
              | tee ../evidence/buildconf.txt
          fi
          {
            echo "### buildconf extraído de: $LIBAVUTIL"
            echo "### tamanho do buildconf.txt: $(wc -c < ../evidence/buildconf.txt 2>/dev/null || echo 0) bytes"
          } | tee ../evidence/buildconf-search.txt
          true

      - name: Publicar artifact (sempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-arm64-lgpl
          if-no-files-found: warn
          path: evidence/**

      # Diagnóstico no Summary da run (visível no navegador sem baixar nada —
      # o download de artifact/logs exige auth admin, o Summary não).
      - name: Resumo diagnóstico no Summary
        if: always()
        working-directory: evidence
        run: |
          {
            echo "## AT-3 build — diagnóstico"
            echo '### aar-path'; echo '```'; cat aar-path.txt 2>/dev/null; echo '```'
            echo '### buildconf.txt (primeiras linhas)'; echo '```'; head -5 buildconf.txt 2>/dev/null; echo '```'
            echo '### buildconf-search.txt'; echo '```'; cat buildconf-search.txt 2>/dev/null; echo '```'
            echo '### logs-found.txt'; echo '```'; cat logs-found.txt 2>/dev/null; echo '```'
            echo '### prebuilt-tree.txt (primeiras 60)'; echo '```'; head -60 prebuilt-tree.txt 2>/dev/null; echo '```'
            echo '### alignment.txt'; echo '```'; cat alignment.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Gate dividido em checagens NOMEADAS: cada conclusão é legível via API
      # anonimamente (nome + success/failure), então a próxima run diz por si
      # qual asserção reprovou, sem eu precisar ler log. Todas rodam (always).
      # Cada gate, ao falhar, emite ::error:: com o conteúdo real — essas
      # mensagens SÃO legíveis anonimamente via
      # GET /repos/{owner}/{repo}/check-runs/{id}/annotations (confirmado
      # em 2026-07-14; download de log/artifact exige auth, annotations não).
      - name: 'Gate 1 — AAR produzido'
        if: always()
        working-directory: evidence
        run: |
          if [ ! -f ffmpeg-kit.aar ]; then
            V=$(cat aar-path.txt 2>/dev/null | tr '\n' ' ' | cut -c1-300)
            echo "::error::Gate1 AAR ausente. aar-path.txt: $V"
            exit 1
          fi
      - name: 'Gate 2 — buildconf capturado (linha real do configure, não coincidência de texto)'
        if: always()
        working-directory: evidence
        run: |
          # --target-os= só existe na linha de configure de verdade — um
          # buildconf.txt "não-vazio" por si só não prova nada (foi o bug dos
          # builds 1-5: passava com conteúdo irrelevante).
          if [ ! -s buildconf.txt ] || ! grep -q -- "--target-os=" buildconf.txt; then
            V=$(cat buildconf-search.txt 2>/dev/null | tr '\n' '|' | cut -c1-500)
            C=$(cat buildconf.txt 2>/dev/null | tr '\n' '|' | cut -c1-500)
            echo "::error::Gate2 buildconf sem --target-os= (não é a linha real). buildconf.txt: $C | search: $V"
            exit 1
          fi
      - name: 'Gate 3 — sem --enable-gpl'
        if: always()
        working-directory: evidence
        run: |
          if grep -q -- "--enable-gpl" buildconf.txt 2>/dev/null; then
            echo "::error::Gate3 --enable-gpl presente: $(cat buildconf.txt | tr '\n' '|' | cut -c1-500)"
            exit 1
          fi
      - name: 'Gate 4 — inventário de alinhamento existe'
        if: always()
        working-directory: evidence
        run: |
          if [ ! -s alignment.txt ]; then
            V=$(find so -name '*.so' 2>/dev/null | tr '\n' '|' | cut -c1-500)
            echo "::error::Gate4 alignment.txt vazio. .so encontradas: $V"
            exit 1
          fi
      - name: 'Gate 5 — todas as .so com LOAD 0x4000 (16 KB)'
        if: always()
        working-directory: evidence
        run: |
          # $NF = última coluna do readelf -lW = Align. Checar essa coluna
          # especificamente, não a linha inteira (ver comentário na coleta).
          BAD=$(grep -E "^\s*LOAD" alignment.txt 2>/dev/null | awk '$NF != "0x4000" {print}' | tr '\n' '|' | cut -c1-800)
          if [ -n "$BAD" ]; then
            echo "::error::Gate5 LOAD com Align != 0x4000: $BAD"
            echo "::error::Gate5 alignment.txt completo: $(cat alignment.txt | tr '\n' '|' | cut -c1-1500)"
            exit 1
          fi

      # Só roda se os 5 gates acima passaram e é push de tag real — mesmo
      # padrão do build-slimt.yml (P1). Publica o AAR como Release
      # PERMANENTE: tool/android/fetch_native_libs.ps1 (F2, revisão de
      # 2026-07-16, lacuna encontrada ao escrever o harness de smoke test da
      # D3.2 — nada empacotava o AAR do FFmpegKit no APK) baixa daqui.
      - name: 'Publicar Release permanente (github.com/.../releases/tag/<tag>)'
        if: success() && startsWith(github.ref, 'refs/tags/')
        working-directory: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ffmpeg-kit.aar > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ffmpeg-kit-next arm64 LGPL ($GITHUB_REF_NAME)" \
            --notes "Build LGPL do FFmpegKitNext (arm64-v8a, sem --enable-gpl) — script versionado em .github/workflows/build-ffmpeg-kit-next.yml. Upstream tag: $UPSTREAM_TAG. Licenças embutidas no AAR (res/raw/): LGPL v3 (FFmpeg) + BSD (openh264) + BSD (cpu_features)." \
            ffmpeg-kit.aar SHA256SUMS.txt
