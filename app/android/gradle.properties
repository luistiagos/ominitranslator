# Memória contida: esta máquina tem pagefile fixo e o -Xmx8G default estoura o
# commit charge do Windows (ver docs/decisoes.md 2026-07-14 e os spikes AT-2/AT-3).
# Serial GC reserva menos espaço virtual que o G1; Kotlin in-process evita um 2º JVM.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Xss512k
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
